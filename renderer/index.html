<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Wordle Solver</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Wordle Solver</h1>
      <div class="header-actions">
        <button id="open-wordle" class="secondary">Open Wordle</button>
        <button id="new-game" class="secondary">New Game</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Your Guess</h2>
        <p class="hint">Type the word you played, then click each tile to match the colors Wordle gave you.</p>
        <div class="tiles" id="tiles">
          <input class="tile" data-index="0" maxlength="1" />
          <input class="tile" data-index="1" maxlength="1" />
          <input class="tile" data-index="2" maxlength="1" />
          <input class="tile" data-index="3" maxlength="1" />
          <input class="tile" data-index="4" maxlength="1" />
        </div>
        <div class="colors" id="colors">
          <button class="color-btn" data-index="0" data-state="b"></button>
          <button class="color-btn" data-index="1" data-state="b"></button>
          <button class="color-btn" data-index="2" data-state="b"></button>
          <button class="color-btn" data-index="3" data-state="b"></button>
          <button class="color-btn" data-index="4" data-state="b"></button>
        </div>
        <div class="row">
          <button id="submit" class="primary">Submit Guess</button>
          <span id="error" class="error"></span>
        </div>
        <h3>History</h3>
        <ul id="history" class="history"></ul>
      </section>

      <section class="panel">
        <h2>Suggestions</h2>
        <div class="suggestion-block">
          <h3 id="suggestion-title">Initial Suggestions</h3>
          <div id="initial" class="chips"></div>
        </div>
        <div class="suggestion-block">
          <h3>Letter Score Suggestions</h3>
          <div id="letter-score" class="chips"></div>
        </div>
        <div class="suggestion-block">
          <h3>Position Weight Suggestions</h3>
          <div id="position-weight" class="chips"></div>
        </div>
        <div class="suggestion-block">
          <h3>Possible Matches (<span id="total">0</span>)</h3>
          <div id="matches" class="chips matches"></div>
        </div>
        <div class="suggestion-block">
          <h3>Pattern</h3>
          <div id="patterns" class="mono"></div>
          <div id="yellows" class="mono"></div>
        </div>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
